<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>门店管理 Liquid Glass</title>
  <style>
    /* ==================== 深色模式变量（纯黑底 + 黑白蓝液态玻璃） ==================== */
    :root, [data-theme="dark"] {
      --blue: #2563eb;
      --blue-bright: #3b82f6;
      --blue-accent: #93c5fd;
      --bg-page: #000000;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
      --glass-border: rgba(255, 255, 255, 0.32);
      --glass-shadow:
        0 14px 34px rgba(0, 0, 0, 0.65),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.5),
        inset 0 -1px 1px rgba(59, 130, 246, 0.25);
      --surface-soft: rgba(255, 255, 255, 0.08);
      --surface-border: rgba(255, 255, 255, 0.22);
      --input-bg: rgba(255, 255, 255, 0.1);
      --placeholder: rgba(203, 213, 225, 0.6);
      --tab-text: rgba(255, 255, 255, 0.68);
      --tab-active-text: #ffffff;
      --tab-active-shadow: 0 0 10px rgba(147, 197, 253, 0.85);
      --indicator-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.28) 0%, rgba(147, 197, 253, 0.18) 50%, rgba(255, 255, 255, 0.24) 100%);
      --indicator-border: rgba(255, 255, 255, 0.78);
    }

    /* ==================== 浅色模式变量（纯白底 + 冰蓝液态玻璃） ==================== */
    [data-theme="light"] {
      --blue: #2563eb;
      --blue-bright: #1d4ed8;
      --blue-accent: #1d4ed8;
      --bg-page: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --glass-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.07) 0%, rgba(255, 255, 255, 0.78) 100%);
      --glass-border: rgba(37, 99, 235, 0.22);
      --glass-shadow:
        0 10px 28px rgba(15, 23, 42, 0.07),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px rgba(37, 99, 235, 0.12);
      --surface-soft: rgba(37, 99, 235, 0.06);
      --surface-border: rgba(37, 99, 235, 0.18);
      --input-bg: rgba(255, 255, 255, 0.85);
      --placeholder: rgba(100, 116, 139, 0.75);
      --tab-text: rgba(15, 23, 42, 0.62);
      --tab-active-text: #1d4ed8;
      --tab-active-shadow: 0 0 8px rgba(37, 99, 235, 0.25);
      --indicator-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.18) 0%, rgba(147, 197, 253, 0.26) 50%, rgba(255, 255, 255, 0.75) 100%);
      --indicator-border: rgba(37, 99, 235, 0.55);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 125px;
      background-color: var(--bg-page);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 液态玻璃面板 */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--glass-border);
      border-radius: 0 0 22px 22px;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--text);
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .manager-pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }
    .theme-btn {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .container { padding: 14px; max-width: 640px; margin: 0 auto; }
    .card {
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    /* 账号切换胶囊栏 */
    .account-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }
    .acc-btn {
      min-width: 0;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: var(--surface-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.22s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .acc-btn.active {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border-color: rgba(255, 255, 255, 0.75);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }

    /* 日历样式 */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-nav {
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      border-radius: 11px;
      padding: 5px 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
    }
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      text-align: center;
    }
    .cal-weekdays div {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue-accent);
      padding-bottom: 4px;
    }
    .cal-day {
      min-width: 0;
      height: 46px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      padding: 2px;
      transition: all 0.18s ease;
    }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.selected {
      background: rgba(37, 99, 235, 0.24);
      border: 1.5px solid var(--blue-bright);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.35);
    }
    .cal-day.today {
      border-color: var(--blue-accent);
    }
    .shift-dot {
      font-size: 9px;
      line-height: 1.1;
      padding: 2px 4px;
      border-radius: 6px;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    /* 黑白蓝统一色系班次标签 */
    .bg-morning { background: #2563eb; color: #ffffff; }
    .bg-evening { background: #1e3a8a; color: #dbeafe; border: 1px solid rgba(147, 197, 253, 0.5); }
    .bg-offday { background: #64748b; color: #ffffff; }
    .bg-unpaid { background: #0f172a; color: #93c5fd; border: 1px solid rgba(147, 197, 253, 0.45); }
    .bg-annual { background: #ffffff; color: #0f172a; border: 1px solid rgba(15, 23, 42, 0.2); }
    .bg-training { background: #38bdf8; color: #050811; }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .name-box {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .name-box label { font-size: 11px; color: var(--blue-accent); font-weight: 600; }

    input, select, button {
      font-size: 13px;
      padding: 9px 11px;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      max-width: 100%;
    }
    input::placeholder { color: var(--placeholder); }
    button.primary {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      cursor: pointer;
    }

    .shift-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .shift-choice {
      min-width: 0;
      padding: 10px 6px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shift-choice:active {
      background: rgba(59, 130, 246, 0.32);
      border-color: var(--blue-bright);
    }
    .shift-choice .swatch {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .stat-item {
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .stat-item strong { display: block; font-size: 13px; margin-bottom: 4px; color: var(--text); }

    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 100px; }
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--surface-border);
      gap: 8px;
    }
    .stock-item:last-child { border-bottom: none; }
    .qty-controls { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .btn-return {
      background: rgba(147, 197, 253, 0.16);
      border: 1px solid rgba(147, 197, 253, 0.45);
      color: var(--text);
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-in {
      background: rgba(59, 130, 246, 0.28);
      border: 1px solid rgba(59, 130, 246, 0.6);
      color: var(--text);
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-sell {
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      color: var(--text);
      font-weight: 700;
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .cctv-card-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 透明液态玻璃底部悬浮胶囊栏 */
    .tab-bar-wrap {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 420px;
      z-index: 40;
    }
    .tab-bar {
      position: relative;
      display: flex;
      padding: 6px;
      border-radius: 999px;
      background-color: transparent;
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      touch-action: none;
      user-select: none;
    }
    .tab-indicator {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 6px;
      width: calc((100% - 12px) / 3);
      border-radius: 999px;
      background: var(--indicator-bg);
      backdrop-filter: blur(18px) saturate(200%) brightness(1.12);
      -webkit-backdrop-filter: blur(18px) saturate(200%) brightness(1.12);
      border: 1.2px solid var(--indicator-border);
      box-shadow:
        0 8px 24px rgba(37, 99, 235, 0.3),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.8);
      transform-origin: center center;
      transition: transform 0.52s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: grab;
      z-index: 1;
    }
    .tab-indicator.dragging {
      transition: none;
      cursor: grabbing;
      box-shadow:
        0 14px 32px rgba(59, 130, 246, 0.45),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95);
    }
    .tab-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      background: transparent !important;
      border: none !important;
      color: var(--tab-text);
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .tab-btn .icon { font-size: 18px; }
    .tab-btn.active { color: var(--tab-active-text); text-shadow: var(--tab-active-shadow); }
    .hidden { display: none !important; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
  </style>
</head>
<body>

  <header class="glass">
    <h1>🏪 门店管理</h1>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggleBtn" onclick="cycleTheme()">🖥️ 自动</button>
      <span class="manager-pill" id="headerBadge">👑 店长视角</span>
    </div>
  </header>

  <div class="container" id="tab-schedule">
    <div class="account-bar" id="accountBar"></div>

    <div class="card glass">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <strong id="calMonthTitle" style="font-size:15px;">2026年 11月</strong>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="hint" id="selectedDateInfo">当前选中日期：-</p>
    </div>

    <div class="card glass">
      <div class="card-title">
        <span>👤 人员名字设置（店长 + 3名员工）</span>
        <button class="primary" style="padding:5px 10px;font-size:12px;" onclick="saveNames()">保存名字</button>
      </div>
      <div class="name-grid">
        <div class="name-box">
          <label>我的名字（店长）</label>
          <input type="text" id="name_0" placeholder="输入你的名字" />
        </div>
        <div class="name-box">
          <label>员工 1</label>
          <input type="text" id="name_1" placeholder="输入员工1名字" />
        </div>
        <div class="name-box">
          <label>员工 2</label>
          <input type="text" id="name_2" placeholder="输入员工2名字" />
        </div>
        <div class="name-box">
          <label>员工 3</label>
          <input type="text" id="name_3" placeholder="输入员工3名字" />
        </div>
      </div>
    </div>

    <div class="card glass">
      <div class="card-title">
        <span>🕒 选择班次</span>
        <button style="padding:4px 8px;font-size:11px;" onclick="setShift('')">清除当天</button>
      </div>
      <div class="shift-options">
        <button class="shift-choice" onclick="setShift('早班')"><span class="swatch bg-morning"></span>早班</button>
        <button class="shift-choice" onclick="setShift('晚班')"><span class="swatch bg-evening"></span>晚班</button>
        <button class="shift-choice" onclick="setShift('offday')"><span class="swatch bg-offday"></span>Offday</button>
        <button class="shift-choice" onclick="setShift('unpaid leave')"><span class="swatch bg-unpaid"></span>Unpaid Leave</button>
        <button class="shift-choice" onclick="setShift('annual leave')"><span class="swatch bg-annual"></span>Annual Leave</button>
        <button class="shift-choice" onclick="setShift('training')"><span class="swatch bg-training"></span>Training</button>
      </div>
    </div>

    <div class="card glass" id="managerDashboard">
      <div class="card-title">
        <span>📊 店长总览（全店排班与工时统计）</span>
      </div>
      <div id="todayAllStaff" style="font-size:12px;margin-bottom:10px;padding:10px;border-radius:14px;background:var(--surface-soft);border:1px solid var(--surface-border);"></div>
      <div class="stats-grid" id="monthlyStatsGrid"></div>
    </div>
  </div>

  <div class="container hidden" id="tab-stock">
    <div class="card glass">
      <div class="card-title"><span>🔗 Google Sheets 同步接口</span></div>
      <div class="row">
        <input type="url" id="sheetUrlInput" placeholder="粘贴你的 Google Apps Script 链接" />
        <button class="primary" onclick="saveSheetUrl()">保存</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button style="flex:1;font-weight:700;" onclick="pullFromSheet()">⬇️ 从 Sheet 同步货单</button>
        <button class="primary" style="flex:1;" onclick="pushAllStocksToSheet()">⬆️ 全量推送到 Sheet</button>
      </div>
      <p class="hint" id="stockSyncMsg">状态：等待连接 Google Sheet...</p>
    </div>

    <div class="card glass">
      <div class="card-title"><span>➕ 新增货品（同步到 Sheet）</span></div>
      <div class="row" style="margin-bottom:0;">
        <input type="text" id="newItemName" placeholder="货品名称" />
        <input type="number" id="newItemQty" placeholder="数量" style="max-width:90px;" />
        <button class="primary" onclick="addStockItem()">添加</button>
      </div>
    </div>

    <div class="card glass">
      <div class="card-title"><span>📦 店内 Stock 清单（退货 / 加1 / 减1）</span></div>
      <div id="stockList"></div>
    </div>
  </div>

  <div class="container hidden" id="tab-cctv">
    <div class="card glass">
      <div class="card-title"><span>📹 TP-Link 监控快捷入口</span></div>
      <button class="cctv-card-btn" onclick="openCctv('tapo://')">
        <span>TP-Link Tapo</span><span>打开 ›</span>
      </button>
      <button class="cctv-card-btn" onclick="openCctv('vigi://')">
        <span>TP-Link VIGI</span><span>打开 ›</span>
      </button>
      <p class="hint">下一步等你的界面跑通后，我教你如何配置与你手机上 TP-Link App 的直连方式。</p>
    </div>
  </div>

  <div class="tab-bar-wrap">
    <nav class="tab-bar" id="glassTabBar">
      <div class="tab-indicator" id="tabIndicator"></div>
      <button class="tab-btn active" data-tab="schedule" data-index="0" onclick="switchTab('schedule', 0, this)">
        <span class="icon">📅</span><span>时间表</span>
      </button>
      <button class="tab-btn" data-tab="stock" data-index="1" onclick="switchTab('stock', 1, this)">
        <span class="icon">📦</span><span>Stock</span>
      </button>
      <button class="tab-btn" data-tab="cctv" data-index="2" onclick="switchTab('cctv', 2, this)">
        <span class="icon">📷</span><span>CCTV</span>
      </button>
    </nav>
  </div>

  <script>
    const KEY = "store_liquid_v3";
    const THEME_KEY = "store_liquid_theme";
    const todayStr = new Date().toISOString().slice(0, 10);

    // ==================== 浅色 / 深色 / 跟随手机主题切换 ====================
    const themeModes = ["auto", "light", "dark"];
    const themeLabels = { auto: "🖥️ 自动", light: "☀️ 浅色", dark: "🌙 深色" };
    let currentThemeMode = localStorage.getItem(THEME_KEY) || "auto";
    const systemDarkQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
      const effective = currentThemeMode === "auto"
        ? (systemDarkQuery.matches ? "dark" : "light")
        : currentThemeMode;
      document.documentElement.setAttribute("data-theme", effective);
      const btn = document.getElementById("themeToggleBtn");
      if (btn) btn.textContent = themeLabels[currentThemeMode];
    }

    function cycleTheme() {
      const nextIdx = (themeModes.indexOf(currentThemeMode) + 1) % themeModes.length;
      currentThemeMode = themeModes[nextIdx];
      localStorage.setItem(THEME_KEY, currentThemeMode);
      applyTheme();
    }

    systemDarkQuery.addEventListener("change", () => {
      if (currentThemeMode === "auto") applyTheme();
    });
    applyTheme();

    // ==================== 业务数据 ====================
    let data = JSON.parse(localStorage.getItem(KEY)) || {
      users: ["我（店长）", "员工 1", "员工 2", "员工 3"],
      activeUser: 0,
      shifts: {},
      sheetUrl: "https://script.google.com/macros/s/AKfycbwKrZdVpaIM-aPyLsD08hzVbzxxteBIEecvCi/exec",
      stocks: []
    };

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDate = todayStr;

    function saveData() {
      localStorage.setItem(KEY, JSON.stringify(data));
    }

    const tabNames = ["schedule", "stock", "cctv"];
    let currentTabIndex = 0;

    function switchTab(name, idx, btn) {
      currentTabIndex = idx;
      tabNames.forEach(t => document.getElementById("tab-" + t).classList.add("hidden"));
      document.getElementById("tab-" + name).classList.remove("hidden");

      const btns = document.querySelectorAll(".tab-btn");
      btns.forEach(b => b.classList.remove("active"));
      const targetBtn = btn || btns[idx];
      if (targetBtn) targetBtn.classList.add("active");

      const indicator = document.getElementById("tabIndicator");
      indicator.classList.remove("dragging");
      indicator.style.transform = `translateX(${idx * 100}%)`;

      if (name === "stock" && data.sheetUrl) {
        pullFromSheet();
      }
    }

    // 轻点直接切换 + 手指滑动停在哪个选项就切到哪一个（果冻放大回弹）
    (function initTabSwipe() {
      const bar = document.getElementById("glassTabBar");
      const indicator = document.getElementById("tabIndicator");
      if (!bar || !indicator) return;

      let isDragging = false;
      let hasMoved = false;
      let startX = 0;
      let lastX = 0;
      let currentOffsetPx = 0;

      function getStepWidth() {
        return (bar.clientWidth - 12) / 3;
      }

      bar.addEventListener("pointerdown", (e) => {
        isDragging = true;
        hasMoved = false;
        startX = e.clientX;
        lastX = e.clientX;
        currentOffsetPx = currentTabIndex * getStepWidth();
      });

      bar.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;

        if (!hasMoved && Math.abs(deltaX) > 6) {
          hasMoved = true;
          indicator.classList.add("dragging");
          bar.setPointerCapture(e.pointerId);
        }
        if (!hasMoved) return;

        const stepW = getStepWidth();
        const maxOffset = stepW * 2;
        const velocityX = e.clientX - lastX;
        lastX = e.clientX;

        let nextPx = currentOffsetPx + deltaX;
        if (nextPx < 0) nextPx = nextPx * 0.25;
        if (nextPx > maxOffset) nextPx = maxOffset + (nextPx - maxOffset) * 0.25;

        const stretch = Math.min(0.16, Math.abs(velocityX) * 0.009);
        const scaleX = 1.30 + stretch;
        const scaleY = 1.24 - stretch * 0.45;

        indicator.style.transform = `translateX(${nextPx}px) scale(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)})`;
      });

      function finishDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        indicator.classList.remove("dragging");

        if (!hasMoved) {
          const btn = e.target.closest(".tab-btn");
          if (btn) {
            const idx = Number(btn.dataset.index);
            switchTab(tabNames[idx], idx, btn);
          }
          return;
        }

        const stepW = getStepWidth();
        const maxOffset = stepW * 2;
        const deltaX = e.clientX - startX;

        let finalPx = currentOffsetPx + deltaX;
        finalPx = Math.max(0, Math.min(maxOffset, finalPx));

        const indicatorCenterPx = finalPx + stepW / 2;
        let targetIdx = Math.floor(indicatorCenterPx / stepW);
        targetIdx = Math.max(0, Math.min(2, targetIdx));

        switchTab(tabNames[targetIdx], targetIdx);
      }

      bar.addEventListener("pointerup", finishDrag);
      bar.addEventListener("pointercancel", finishDrag);
    })();

    // ==================== 时间表功能 ====================
    function renderAccounts() {
      const bar = document.getElementById("accountBar");
      bar.innerHTML = data.users.map((u, idx) => `
        <button class="acc-btn ${data.activeUser === idx ? 'active' : ''}" onclick="selectUser(${idx})">
          ${idx === 0 ? '👑 ' : ''}${u || ('员工 ' + idx)}
        </button>
      `).join("");

      data.users.forEach((u, idx) => {
        document.getElementById("name_" + idx).value = u;
      });

      const isManager = data.activeUser === 0;
      document.getElementById("headerBadge").textContent = isManager ? "👑 店长视角" : "👤 " + data.users[data.activeUser];
      document.getElementById("managerDashboard").classList.toggle("hidden", !isManager);
    }

    function selectUser(idx) {
      data.activeUser = idx;
      saveData();
      renderAccounts();
      renderCalendar();
    }

    function saveNames() {
      for (let i = 0; i < 4; i++) {
        const val = document.getElementById("name_" + i).value.trim();
        if (val) data.users[i] = val;
      }
      saveData();
      renderAccounts();
      renderCalendar();
      alert("名字已更新！");
    }

    function shiftClass(s) {
      if (s === "早班") return "bg-morning";
      if (s === "晚班") return "bg-evening";
      if (s === "offday") return "bg-offday";
      if (s === "unpaid leave") return "bg-unpaid";
      if (s === "annual leave") return "bg-annual";
      if (s === "training") return "bg-training";
      return "";
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById("calMonthTitle").textContent = `${currentYear}年 ${currentMonth + 1}月`;
      const grid = document.getElementById("calGrid");
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      let html = "";
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="cal-day empty"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const key = `${data.activeUser}_${dateStr}`;
        const shift = data.shifts[key] || "";
        const isSel = dateStr === selectedDate ? "selected" : "";
        const isToday = dateStr === todayStr ? "today" : "";
        html += `
          <div class="cal-day ${isSel} ${isToday}" onclick="pickDate('${dateStr}')">
            <span>${d}</span>
            ${shift ? `<span class="shift-dot ${shiftClass(shift)}">${shift}</span>` : ""}
          </div>
        `;
      }
      grid.innerHTML = html;

      const curShift = data.shifts[`${data.activeUser}_${selectedDate}`] || "未排班";
      document.getElementById("selectedDateInfo").textContent =
        `当前账号：【${data.users[data.activeUser]}】 | 选中日期：${selectedDate}（${curShift}）`;

      renderManagerStats();
    }

    function pickDate(dateStr) {
      selectedDate = dateStr;
      renderCalendar();
    }

    function setShift(shiftName) {
      const key = `${data.activeUser}_${selectedDate}`;
      if (!shiftName) {
        delete data.shifts[key];
      } else {
        data.shifts[key] = shiftName;
      }
      saveData();
      renderCalendar();
    }

    function renderManagerStats() {
      if (data.activeUser !== 0) return;

      const daySummary = data.users.map((u, idx) => {
        const s = data.shifts[`${idx}_${selectedDate}`] || "未排班";
        return `${u}：<b>${s}</b>`;
      }).join(" ｜ ");
      document.getElementById("todayAllStaff").innerHTML = `📅 <b style="color:var(--blue-accent)">${selectedDate} 全店班表：</b><br/>${daySummary}`;

      const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
      const statsHtml = data.users.map((u, idx) => {
        let workDays = 0, offDays = 0, leaveDays = 0;
        Object.keys(data.shifts).forEach(k => {
          if (k.startsWith(`${idx}_${monthPrefix}`)) {
            const val = data.shifts[k];
            if (val === "早班" || val === "晚班" || val === "training") workDays++;
            else if (val === "offday") offDays++;
            else leaveDays++;
          }
        });
        return `
          <div class="stat-item">
            <strong>${idx === 0 ? "👑 " : ""}${u}</strong>
            出勤/培训：${workDays} 天<br/>
            Offday：${offDays} 天 ｜ 请假：${leaveDays} 天
          </div>
        `;
      }).join("");
      document.getElementById("monthlyStatsGrid").innerHTML = statsHtml;
    }

    // ==================== Stock 功能（跟 Sheet 同步 + 退货/加1/减1） ====================
    const sheetInputEl = document.getElementById("sheetUrlInput");
    if (sheetInputEl) sheetInputEl.value = data.sheetUrl || "";

    function saveSheetUrl() {
      data.sheetUrl = document.getElementById("sheetUrlInput").value.trim();
      saveData();
      alert("Google Sheets 链接已保存");
      if (data.sheetUrl) pullFromSheet();
    }

    function renderStocks() {
      const list = document.getElementById("stockList");
      if (!list) return;
      if (!data.stocks || !data.stocks.length) {
        list.innerHTML = `<p class="hint">Sheet 暂无货品，请先添加或点击“从 Sheet 同步货单”。</p>`;
        return;
      }
      list.innerHTML = data.stocks.map((s, idx) => `
        <div class="stock-item">
          <div style="min-width:0;">
            <strong style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.name}</strong>
            <span style="font-size:11px;color:var(--muted);">库存: <b style="color:var(--text)">${s.qty}</b> ｜ Sales Qty: <b style="color:var(--blue-accent)">${s.salesQty || 0}</b></span>
          </div>
          <div class="qty-controls">
            <button class="btn-return" onclick="handleStockAction(${idx}, 'return')">退货</button>
            <button class="btn-in" onclick="handleStockAction(${idx}, 'add')">加1</button>
            <button class="btn-sell" onclick="handleStockAction(${idx}, 'minus')">减1</button>
          </div>
        </div>
      `).join("");
    }

    async function handleStockAction(idx, type) {
      const item = data.stocks[idx];
      if (!item) return;

      let changeText = "";
      if (type === "add") {
        item.qty = Number(item.qty || 0) + 1;
        changeText = `加1 -> 库存 ${item.qty}`;
      } else if (type === "minus") {
        if (Number(item.qty || 0) <= 0) {
          return alert(`【${item.name}】库存已为 0，无法再减 1`);
        }
        item.qty = Number(item.qty || 0) - 1;
        item.salesQty = Number(item.salesQty || 0) + 1;
        changeText = `减1 -> 库存 ${item.qty}，Sales Qty ${item.salesQty}`;
      } else if (type === "return") {
        item.qty = Number(item.qty || 0) + 1;
        item.salesQty = Math.max(0, Number(item.salesQty || 0) - 1);
        changeText = `退货 -> 库存 ${item.qty}，Sales Qty ${item.salesQty}`;
      }

      saveData();
      renderStocks();

      await syncSingleItemToSheet({
        action: type,
        name: item.name,
        qty: item.qty,
        salesQty: item.salesQty || 0,
        note: `${item.name} ${changeText}`
      });
    }

    async function addStockItem() {
      const name = document.getElementById("newItemName").value.trim();
      const qty = parseInt(document.getElementById("newItemQty").value, 10) || 0;
      if (!name) return alert("请输入货品名称");

      const existingIdx = data.stocks.findIndex(s => s.name === name);
      if (existingIdx >= 0) {
        data.stocks[existingIdx].qty = Number(data.stocks[existingIdx].qty || 0) + qty;
      } else {
        data.stocks.push({ name, qty, salesQty: 0 });
      }

      saveData();
      renderStocks();
      document.getElementById("newItemName").value = "";
      document.getElementById("newItemQty").value = "";

      const target = existingIdx >= 0 ? data.stocks[existingIdx] : data.stocks[data.stocks.length - 1];
      await syncSingleItemToSheet({
        action: "add_new",
        name: target.name,
        qty: target.qty,
        salesQty: target.salesQty || 0,
        note: `新增/补货 ${target.name} (+${qty})`
      });
    }

    async function syncSingleItemToSheet(payload) {
      const msg = document.getElementById("stockSyncMsg");
      if (!data.sheetUrl) {
        msg.textContent = `本地已更新（${payload.note}），请先保存 Sheet 链接。`;
        return;
      }
      msg.textContent = `正在同步【${payload.name}】到 Sheet...`;
      try {
        await fetch(data.sheetUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        msg.textContent = `✅ 已同步（${new Date().toLocaleTimeString()}）：${payload.note}`;
      } catch (e) {
        msg.textContent = `⚠️ 同步失败，请检查网络或 Apps Script 权限。`;
      }
    }

    async function pushAllStocksToSheet() {
      const msg = document.getElementById("stockSyncMsg");
      if (!data.sheetUrl) return alert("请先填写并保存你的 Google Apps Script 链接");
      msg.textContent = "正在全量推送到 Sheet...";
      try {
        await fetch(data.sheetUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "sync_all",
            items: data.stocks
          })
        });
        msg.textContent = `✅ 已全量推送至 Sheet（${new Date().toLocaleTimeString()}）`;
      } catch (e) {
        msg.textContent = "⚠️ 推送失败，请检查网络。";
      }
    }

    async function pullFromSheet() {
      const msg = document.getElementById("stockSyncMsg");
      if (!data.sheetUrl) {
        msg.textContent = "状态：请先填入 Google Apps Script 链接并保存。";
        return;
      }
      msg.textContent = "正在从 Sheet 读取货单...";
      try {
        const res = await fetch(data.sheetUrl);
        const json = await res.json();
        if (Array.isArray(json.items)) {
          data.stocks = json.items.map(it => ({
            name: String(it.name || "").trim(),
            qty: Number(it.qty) || 0,
            salesQty: Number(it.salesQty) || 0
          })).filter(it => it.name);
          saveData();
          renderStocks();
          msg.textContent = `✅ 已与 Sheet 同步，共 ${data.stocks.length} 项货品（${new Date().toLocaleTimeString()}）`;
        }
      } catch (e) {
        msg.textContent = "⚠️ 读取失败：请确认 Apps Script 已部署且“谁可以访问”选了 Anyone。";
      }
    }

    function openCctv(scheme) {
      window.location.href = scheme;
    }

    renderAccounts();
    renderCalendar();
    renderStocks();
    if (data.sheetUrl) pullFromSheet();
  </script>
</body>
</html>
