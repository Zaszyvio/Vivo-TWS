<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Vivo Store Manager</title>
  <style>
    :root, [data-theme="dark"] {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --btn-opacity: 1;
      --font-scale: 1;
      --blue: #2563eb;
      --blue-bright: #3b82f6;
      --blue-accent: #93c5fd;
      --bg-page: #000000;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.06) 100%);
      --glass-border: rgba(255, 255, 255, 0.34);
      --glass-shadow:
        0 14px 34px rgba(0, 0, 0, 0.65),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.5),
        inset 0 -1px 1px rgba(59, 130, 246, 0.25);
      --surface-soft: rgba(255, 255, 255, 0.09);
      --surface-border: rgba(255, 255, 255, 0.24);
      --input-bg: rgba(255, 255, 255, 0.12);
      --placeholder: rgba(203, 213, 225, 0.65);
      --tab-text: rgba(255, 255, 255, 0.72);
      --tab-active-text: #ffffff;
      --tab-active-shadow: 0 0 12px rgba(147, 197, 253, 0.9);
      --indicator-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.32) 0%, rgba(147, 197, 253, 0.22) 50%, rgba(255, 255, 255, 0.26) 100%);
      --indicator-border: rgba(255, 255, 255, 0.85);
    }

    [data-theme="light"] {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --btn-opacity: var(--btn-opacity, 1);
      --font-scale: var(--font-scale, 1);
      --blue: #2563eb;
      --blue-bright: #1d4ed8;
      --blue-accent: #1d4ed8;
      --bg-page: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.86) 0%, rgba(239, 246, 255, 0.78) 100%);
      --glass-border: rgba(37, 99, 235, 0.24);
      --glass-shadow:
        0 10px 28px rgba(15, 23, 42, 0.08),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.96),
        inset 0 -1px 1px rgba(37, 99, 235, 0.12);
      --surface-soft: rgba(37, 99, 235, 0.06);
      --surface-border: rgba(37, 99, 235, 0.2);
      --input-bg: rgba(255, 255, 255, 0.9);
      --placeholder: rgba(100, 116, 139, 0.75);
      --tab-text: rgba(15, 23, 42, 0.65);
      --tab-active-text: #1d4ed8;
      --tab-active-shadow: 0 0 8px rgba(37, 99, 235, 0.25);
      --indicator-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.2) 0%, rgba(147, 197, 253, 0.28) 50%, rgba(255, 255, 255, 0.85) 100%);
      --indicator-border: rgba(37, 99, 235, 0.6);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: calc(16px * var(--font-scale));
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--safe-bottom) + 140px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      background-color: var(--bg-page);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 35%, rgba(59, 130, 246, 0.28), #020617 72%);
      color: #ffffff;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #splashScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.55), rgba(29, 78, 216, 0.35));
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 18px 40px rgba(37, 99, 235, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .splash-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .splash-sub {
      font-size: 12px;
      color: rgba(226, 232, 240, 0.8);
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--glass-border);
      border-radius: 0 0 24px 24px;
    }
    header h1 {
      font-size: 1.05rem;
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--text);
      white-space: nowrap;
    }
    .theme-btn {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      opacity: var(--btn-opacity);
    }

    .container { padding: 14px; max-width: 640px; margin: 0 auto; }
    .card {
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      margin: 0 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .account-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }
    .acc-btn {
      min-width: 0;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: var(--btn-opacity);
    }
    .acc-btn.active {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border-color: rgba(255, 255, 255, 0.75);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-nav {
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      border-radius: 11px;
      padding: 6px 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      opacity: var(--btn-opacity);
    }
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      text-align: center;
    }
    .cal-weekdays div {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--blue-accent);
      padding-bottom: 4px;
    }
    .cal-day {
      min-width: 0;
      height: 48px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      padding: 2px;
    }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.selected {
      background: rgba(37, 99, 235, 0.24);
      border: 1.5px solid var(--blue-bright);
    }
    .cal-day.today { border-color: var(--blue-accent); }
    .shift-dot {
      font-size: 0.62rem;
      line-height: 1.1;
      padding: 2px 4px;
      border-radius: 6px;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .bg-morning { background: #2563eb; color: #ffffff; }
    .bg-evening { background: #1e3a8a; color: #dbeafe; border: 1px solid rgba(147, 197, 253, 0.5); }
    .bg-offday { background: #64748b; color: #ffffff; }
    .bg-unpaid { background: #0f172a; color: #93c5fd; border: 1px solid rgba(147, 197, 253, 0.45); }
    .bg-annual { background: #ffffff; color: #0f172a; border: 1px solid rgba(15, 23, 42, 0.2); }
    .bg-training { background: #38bdf8; color: #050811; }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .name-box {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .name-box label { font-size: 0.72rem; color: var(--blue-accent); font-weight: 600; }

    input, select, button {
      font-size: 0.84rem;
      padding: 9px 11px;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      max-width: 100%;
    }
    button { opacity: var(--btn-opacity); }
    input::placeholder { color: var(--placeholder); }
    button.primary {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .shift-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .shift-choice {
      min-width: 0;
      padding: 10px 6px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shift-choice .swatch {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .stat-item {
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .stat-item strong { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text); }

    .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .row input { flex: 1; min-width: 120px; }

    .stock-card-item {
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 18px;
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
    }
    .stock-card-item:last-child { margin-bottom: 0; }
    .stock-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .stock-model-name {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      display: block;
      margin-bottom: 3px;
    }
    .stock-sub-meta {
      font-size: 0.74rem;
      color: var(--muted);
      display: block;
    }
    .stock-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .stock-big-box {
      padding: 6px 12px;
      border-radius: 14px;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid rgba(147, 197, 253, 0.55);
      text-align: center;
      min-width: 68px;
    }
    .stock-big-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--blue-accent);
    }
    .stock-big-num {
      display: block;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.15;
      color: var(--text);
    }
    .sales-side-box {
      padding: 6px 10px;
      border-radius: 14px;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      text-align: center;
      min-width: 62px;
    }
    .sales-side-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--muted);
    }
    .sales-side-num {
      display: block;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--blue-accent);
    }
    .qty-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .btn-return, .btn-in, .btn-sell {
      font-weight: 700;
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 0.84rem;
      cursor: pointer;
      color: var(--text);
    }
    .btn-return { background: rgba(147, 197, 253, 0.16); border: 1px solid rgba(147, 197, 253, 0.45); }
    .btn-in { background: rgba(59, 130, 246, 0.32); border: 1px solid rgba(59, 130, 246, 0.65); }
    .btn-sell { background: var(--input-bg); border: 1px solid var(--surface-border); }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--surface-border);
    }
    .setting-item:last-child { border-bottom: none; }
    .setting-label { font-size: 0.86rem; font-weight: 700; }
    .setting-desc { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
    .qr-box {
      margin-top: 12px;
      padding: 16px;
      border-radius: 18px;
      background: #ffffff;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .qr-box img { width: 176px; height: 176px; display: block; }

    .tab-bar-wrap {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 18px);
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 460px;
      z-index: 40;
    }
    .tab-bar {
      position: relative;
      display: flex;
      padding: 7px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1.2px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      touch-action: none;
      user-select: none;
    }
    .tab-indicator {
      position: absolute;
      top: 7px;
      bottom: 7px;
      left: 7px;
      width: calc((100% - 14px) / 3);
      border-radius: 999px;
      background: var(--indicator-bg);
      border: 1.2px solid var(--indicator-border);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1;
    }
    .tab-indicator.dragging { transition: none; }
    .tab-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      background: transparent !important;
      border: none !important;
      color: var(--tab-text);
      padding: 10px 6px;
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      opacity: 1 !important;
    }
    .tab-btn .icon { font-size: 1.25rem; line-height: 1.1; }
    .tab-btn.active { color: var(--tab-active-text); text-shadow: var(--tab-active-shadow); }
    .hidden { display: none !important; }
    .hint { font-size: 0.76rem; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
  </style>
</head>
<body>

  <div id="splashScreen">
    <div class="splash-logo">V</div>
    <div class="splash-title" id="splashTitle">Vivo Store Manager</div>
    <div class="splash-sub" id="splashSub">正在启动门店工作台...</div>
  </div>

  <header class="glass">
    <h1 id="appHeaderTitle">🏪 Vivo 门店管理</h1>
    <button class="theme-btn" id="themeToggleBtn" onclick="cycleTheme()">🖥️ 自动</button>
  </header>

  <div class="container" id="tab-schedule">
    <div class="account-bar" id="accountBar"></div>

    <div class="card glass">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <strong id="calMonthTitle" style="font-size:0.95rem;">2026-11</strong>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">
        <div data-w="0">日</div><div data-w="1">一</div><div data-w="2">二</div><div data-w="3">三</div><div data-w="4">四</div><div data-w="5">五</div><div data-w="6">六</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="hint" id="selectedDateInfo">-</p>
    </div>

    <div class="card glass">
      <div class="card-title">
        <span id="staffCardTitle">人员名字设置</span>
        <button class="primary" style="padding:6px 12px;font-size:0.76rem;" onclick="saveNames()" id="saveNamesBtn">保存</button>
      </div>
      <div class="name-grid">
        <div class="name-box">
          <label id="lblName0">店长</label>
          <input type="text" id="name_0" />
        </div>
        <div class="name-box">
          <label id="lblName1">员工 1</label>
          <input type="text" id="name_1" />
        </div>
        <div class="name-box">
          <label id="lblName2">员工 2</label>
          <input type="text" id="name_2" />
        </div>
        <div class="name-box">
          <label id="lblName3">员工 3</label>
          <input type="text" id="name_3" />
        </div>
      </div>
    </div>

    <div class="card glass">
      <div class="card-title">
        <span id="shiftCardTitle">选择班次</span>
        <button style="padding:5px 10px;font-size:0.74rem;" onclick="setShift('')" id="clearShiftBtn">清除</button>
      </div>
      <div class="shift-options">
        <button class="shift-choice" onclick="setShift('早班')"><span class="swatch bg-morning"></span><span data-s="早班">早班</span></button>
        <button class="shift-choice" onclick="setShift('晚班')"><span class="swatch bg-evening"></span><span data-s="晚班">晚班</span></button>
        <button class="shift-choice" onclick="setShift('offday')"><span class="swatch bg-offday"></span><span data-s="offday">Offday</span></button>
        <button class="shift-choice" onclick="setShift('unpaid leave')"><span class="swatch bg-unpaid"></span><span data-s="unpaid leave">无薪假</span></button>
        <button class="shift-choice" onclick="setShift('annual leave')"><span class="swatch bg-annual"></span><span data-s="annual leave">年假</span></button>
        <button class="shift-choice" onclick="setShift('training')"><span class="swatch bg-training"></span><span data-s="training">培训</span></button>
      </div>
    </div>

    <div class="card glass" id="managerDashboard">
      <div class="card-title"><span id="summaryCardTitle">每月排班统计</span></div>
      <div id="todayAllStaff" style="font-size:0.78rem;margin-bottom:10px;padding:10px;border-radius:14px;background:var(--surface-soft);border:1px solid var(--surface-border);"></div>
      <div class="stats-grid" id="monthlyStatsGrid"></div>
    </div>
  </div>

  <div class="container hidden" id="tab-stock">
    <div class="card glass">
      <div class="card-title"><span id="sheetCardTitle">Google Sheets 同步</span></div>
      <div class="row">
        <input type="url" id="sheetUrlInput" placeholder="Google Apps Script URL" />
        <button class="primary" onclick="saveSheetUrl()" id="saveSheetBtn">保存</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button style="flex:1;font-weight:700;" onclick="pullFromSheet()" id="pullSheetBtn">⬇️ 拉取库存</button>
        <select id="stockCatFilter" onchange="renderStocks()" style="max-width:130px;">
          <option value="ALL" id="catAllOpt">全部</option>
          <option value="Phone">Phone</option>
          <option value="Accessory">Accessory</option>
        </select>
      </div>
      <p class="hint" id="stockSyncMsg">-</p>
    </div>

    <div class="card glass">
      <div class="card-title"><span id="stockListTitle">库存清单</span></div>
      <input type="text" id="stockSearchInput" oninput="renderStocks()" placeholder="型号 / 颜色..." style="width:100%;margin-bottom:12px;" />
      <div id="stockList"></div>
    </div>
  </div>

  <div class="container hidden" id="tab-settings">
    <div class="card glass">
      <div class="card-title"><span id="accSettingTitle">账号与 Google 登录</span></div>
      <div class="row">
        <input type="text" id="accDisplayName" placeholder="显示名称" />
        <input type="email" id="accGoogleEmail" placeholder="Google 邮箱 (name@gmail.com)" />
      </div>
      <div class="row" style="margin-bottom:0;">
        <button class="primary" onclick="saveAccountProfile()" id="saveAccBtn">保存账号</button>
        <button onclick="quickGoogleBind()" id="googleBindBtn">G 快速填入 Google</button>
      </div>
      <p class="hint" id="accStatusText">-</p>
    </div>

    function switchTab(name, idx, btn) {
      currentTabIndex = idx;
      tabNames.forEach(t => document.getElementById("tab-" + t).classList.add("hidden"));
      document.getElementById("tab-" + name).classList.remove("hidden");

      const btns = document.querySelectorAll(".tab-btn");
      btns.forEach(b => b.classList.remove("active"));
      const targetBtn = btn || btns[idx];
      if (targetBtn) targetBtn.classList.add("active");

      const indicator = document.getElementById("tabIndicator");
      indicator.classList.remove("dragging");
      indicator.style.transform = `translateX(${idx * 100}%)`;

      if (name === "stock" && data.sheetUrl) pullFromSheet();
    }

    (function initTabSwipe() {
      const bar = document.getElementById("glassTabBar");
      const indicator = document.getElementById("tabIndicator");
      if (!bar || !indicator) return;

      let isDragging = false;
      let hasMoved = false;
      let startX = 0;
      let currentOffsetPx = 0;

      function getStepWidth() {
        return (bar.clientWidth - 14) / 3;
      }

      bar.addEventListener("pointerdown", (e) => {
        isDragging = true;
        hasMoved = false;
        startX = e.clientX;
        currentOffsetPx = currentTabIndex * getStepWidth();
      });

      bar.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        if (!hasMoved && Math.abs(deltaX) > 6) {
          hasMoved = true;
          indicator.classList.add("dragging");
          bar.setPointerCapture(e.pointerId);
        }
        if (!hasMoved) return;
        const stepW = getStepWidth();
        const maxOffset = stepW * 2;
        let nextPx = Math.max(0, Math.min(maxOffset, currentOffsetPx + deltaX));
        indicator.style.transform = `translateX(${nextPx}px)`;
      });

      function finishDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        indicator.classList.remove("dragging");
        if (!hasMoved) {
          const btn = e.target.closest(".tab-btn");
          if (btn) switchTab(tabNames[Number(btn.dataset.index)], Number(btn.dataset.index), btn);
          return;
        }
        const stepW = getStepWidth();
        const maxOffset = stepW * 2;
        const finalPx = Math.max(0, Math.min(maxOffset, currentOffsetPx + (e.clientX - startX)));
        const targetIdx = Math.max(0, Math.min(2, Math.floor((finalPx + stepW / 2) / stepW)));
        switchTab(tabNames[targetIdx], targetIdx);
      }

      bar.addEventListener("pointerup", finishDrag);
      bar.addEventListener("pointercancel", finishDrag);
    })();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDate = todayStr;

    function renderAccounts() {
      const bar = document.getElementById("accountBar");
      bar.innerHTML = data.users.map((u, idx) => `

      data.users.forEach((u, idx) => {
        document.getElementById("name_" + idx).value = u;
      });

    function selectUser(idx) {
      data.activeUser = idx;
      saveData();
      renderAccounts();
      renderCalendar();

    function saveNames() {
      for (let i = 0; i < 4; i++) {
        const val = document.getElementById("name_" + i).value.trim();
        if (val) data.users[i] = val;

      saveData();
      renderAccounts();
      renderCalendar();
      alert("已保存");

    function shiftClass(s) {
      if (s === "早班") return "bg-morning";
      if (s === "晚班") return "bg-evening";
      if (s === "offday") return "bg-offday";
      if (s === "unpaid leave") return "bg-unpaid";
      if (s === "annual leave") return "bg-annual";
      if (s === "training") return "bg-training";
      return "";
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      const t = I18N[data.lang] || I18N.zh;
      document.getElementById("calMonthTitle").textContent = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
      const grid = document.getElementById("calGrid");
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      let html = "";
      for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const shift = data.shifts[`${data.activeUser}_${dateStr}`] || "";
        const label = t.shifts[shift] || shift;
        html += `
          <div class="cal-day ${dateStr === selectedDate ? 'selected' : ''} ${dateStr === todayStr ? 'today' : ''}" onclick="pickDate('${dateStr}')">
            <span>${d}</span>
            ${shift ? `<span class="shift-dot ${shiftClass(shift)}">${label}</span>` : ""}
          </div>
        `;
      }
      grid.innerHTML = html;

      const curRaw = data.shifts[`${data.activeUser}_${selectedDate}`] || "";
      const curLabel = curRaw ? (t.shifts[curRaw] || curRaw) : "-";
      document.getElementById("selectedDateInfo").textContent = `${data.users[data.activeUser]} · ${selectedDate} · ${curLabel}`;
      renderSummary();
    }

    function pickDate(dateStr) {
      selectedDate = dateStr;
      renderCalendar();
    }

    function setShift(shiftName) {
      const key = `${data.activeUser}_${selectedDate}`;
      if (!shiftName) delete data.shifts[key];
      else data.shifts[key] = shiftName;
      saveData();
      renderCalendar();
    }

    function renderSummary() {
      const t = I18N[data.lang] || I18N.zh;
      const daySummary = data.users.map((u, idx) => {
        const raw = data.shifts[`${idx}_${selectedDate}`] || "";
        const lbl = raw ? (t.shifts[raw] || raw) : "-";
        return `${u}: <b>${lbl}</b>`;
      }).join(" ｜ ");
      document.getElementById("todayAllStaff").innerHTML = `${selectedDate}: ${daySummary}`;

      const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
      document.getElementById("monthlyStatsGrid").innerHTML = data.users.map((u, idx) => {
        let workDays = 0, offDays = 0, leaveDays = 0;
        Object.keys(data.shifts).forEach(k => {
          if (k.startsWith(`${idx}_${monthPrefix}`)) {
            const val = data.shifts[k];
            if (val === "早班" || val === "晚班" || val === "training") workDays++;
            else if (val === "offday") offDays++;
            else leaveDays++;
          }
        });
        return `<div class="stat-item"><strong>${u}</strong>${workDays}d · Off ${offDays}d · Leave ${leaveDays}d</div>`;
      }).join("");
    }

    function renderStocks() {
      const list = document.getElementById("stockList");
      if (!list) return;
      const t = I18N[data.lang] || I18N.zh;
      const cat = document.getElementById("stockCatFilter")?.value || "ALL";
      const kw = (document.getElementById("stockSearchInput")?.value || "").trim().toLowerCase();

      const filtered = (data.stocks || []).filter(item => {
        const matchCat = cat === "ALL" || item.category === cat;
        const matchKw = !kw ||
          String(item.model || "").toLowerCase().includes(kw) ||
          String(item.color || "").toLowerCase().includes(kw);
        return matchCat && matchKw;
      });

      if (!filtered.length) {
        list.innerHTML = `<p class="hint">-</p>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const realIdx = data.stocks.indexOf(item);
        const subInfo = [item.category || "", item.color || "", item.price ? `RM${item.price}` : ""].filter(Boolean).join(" · ");
        return `
          <div class="stock-card-item">
            <div class="stock-top-row">
              <div style="min-width:0;">
                <span class="stock-model-name">${item.model}</span>
                <span class="stock-sub-meta">${subInfo}</span>
              </div>
              <div class="stock-badges">
                <div class="stock-big-box">
                  <span class="stock-big-label">STOCK</span>
                  <span class="stock-big-num">${item.stock}</span>
                </div>
                <div class="sales-side-box">
                  <span class="sales-side-label">SALES QTY</span>
                  <span class="sales-side-num">${item.sold || 0}</span>
                </div>

            </div>
            <div class="qty-controls">
              <button class="btn-return" onclick="handleStockAction(${realIdx}, 'return')">${t.btnReturn}</button>
              <button class="btn-in" onclick="handleStockAction(${realIdx}, 'add')">${t.btnAdd}</button>
              <button class="btn-sell" onclick="handleStockAction(${realIdx}, 'minus')">${t.btnMinus}</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function handleStockAction(idx, type) {
      const item = data.stocks[idx];
      if (!item) return;
      let curStock = Number(item.stock) || 0;
      let curSold = Number(item.sold) || 0;
      let note = "";

      if (type === "add") {
        curStock += 1;
        note = `+1 -> ${curStock}`;
      } else if (type === "minus") {
        if (curStock <= 0) return alert("Stock = 0");
        curStock -= 1;
        curSold += 1;
        note = `-1 -> ${curStock}`;
      } else if (type === "return") {
        curStock += 1;
        curSold = Math.max(0, curSold - 1);
        note = `Return -> ${curStock}`;
      }

      item.stock = curStock;
      item.sold = curSold;
      saveData();
      renderStocks();

      await syncRowToSheet({
        sheet: item.sheet,
        row: item.row,
        stock: item.stock,
        sold: item.sold,
        note: `${item.model} ${note}`
      });
    }

    async function syncRowToSheet(payload) {
      const msg = document.getElementById("stockSyncMsg");
      const url = (document.getElementById("sheetUrlInput")?.value || data.sheetUrl || "").trim();
      if (!url) return;
      msg.textContent = `${payload.note}...`;
      try {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        msg.textContent = `OK (${new Date().toLocaleTimeString()}): ${payload.note}`;
      } catch (e) {
        msg.textContent = `Sync error`;
      }
    }

    async function pullFromSheet() {
      const msg = document.getElementById("stockSyncMsg");
      const url = (document.getElementById("sheetUrlInput")?.value || data.sheetUrl || "").trim();
      if (!url) return;
      data.sheetUrl = url;
      saveData();
      msg.textContent = "Loading...";
      try {
        const res = await fetch(url, { cache: "no-store" });
        const json = JSON.parse(await res.text());
        const list = Array.isArray(json) ? json : (Array.isArray(json.items) ? json.items : null);
        if (!list) throw new Error("Invalid data");
        data.stocks = list.map(it => ({
          row: Number(it.row),
          sheet: String(it.sheet || "Daily Sales-Phone"),
          category: String(it.category || ""),
          model: String(it.model || "").trim(),
          color: String(it.color || "").trim(),
          price: Number(it.price) || 0,
          sold: Number(it.sold) || 0,
          stock: Number(it.stock) || 0,
          demo: Number(it.demo) || 0
        })).filter(it => it.model && it.row > 0);
        saveData();
        renderStocks();
        msg.textContent = `${data.stocks.length} (${new Date().toLocaleTimeString()})`;
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    function renderAccountProfile() {
      const p = data.profile || { name: "", email: "" };
      document.getElementById("accDisplayName").value = p.name || "";
      document.getElementById("accGoogleEmail").value = p.email || "";
      document.getElementById("accStatusText").textContent = p.email ? `${p.name || ""} (${p.email})` : (p.name || "-");
    }

    function saveAccountProfile() {
      data.profile = {
        name: (document.getElementById("accDisplayName").value || "").trim(),
        email: (document.getElementById("accGoogleEmail").value || "").trim()
      };
      if (data.profile.name) {
        data.users[data.activeUser] = data.profile.name;
      }
      saveData();
      renderAccounts();
      renderAccountProfile();
    }

    function quickGoogleBind() {
      const email = prompt("Google Email:");
      if (!email) return;
      const name = email.split("@")[0];
      data.profile = { name, email: email.trim() };
      saveData();
      renderAccountProfile();
    }

    function applyAccessibility() {
      const a = data.accessibility || { btnOpacity: 100, fontScale: 100 };
      document.documentElement.style.setProperty("--btn-opacity", (a.btnOpacity / 100).toFixed(2));
      document.documentElement.style.setProperty("--font-scale", (a.fontScale / 100).toFixed(2));
      document.getElementById("btnOpacityRange").value = a.btnOpacity;
      document.getElementById("fontScaleRange").value = a.fontScale;
      document.getElementById("btnOpacityVal").textContent = `${a.btnOpacity}%`;
      document.getElementById("fontScaleVal").textContent = `${a.fontScale}%`;
    }

    function updateAccessibility() {
      data.accessibility = {
        btnOpacity: Number(document.getElementById("btnOpacityRange").value),
        fontScale: Number(document.getElementById("fontScaleRange").value)
      };
      saveData();
      applyAccessibility();
    }

    function renderSavedQr() {
      const url = (data.apkUrl || "").trim();
      document.getElementById("apkDownloadUrlInput").value = url;
      const box = document.getElementById("qrResultBox");
      if (!url) {
        box.classList.add("hidden");
        return;
      }
      document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}`;
      document.getElementById("qrLinkCaption").textContent = url;
      box.classList.remove("hidden");
    }

    function generateDownloadQr() {
      const url = (document.getElementById("apkDownloadUrlInput").value || "").trim();
      if (!url || !/^https?:\/\//i.test(url)) return alert("http:// or https://");
      data.apkUrl = url;
      saveData();
      renderSavedQr();
    }

    applyTheme();
    applyAccessibility();
    applyLanguage();
    renderSavedQr();
    if (data.sheetUrl) pullFromSheet();

    setTimeout(() => {
      const splash = document.getElementById("splashScreen");
      if (splash) splash.classList.add("hide");
    }, 1200);
  </script>
</body>
</html>
