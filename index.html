<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>门店管理 Liquid Glass</title>
  <style>
    /* ==================== 深色模式变量（纯黑底 + 黑白蓝液态玻璃） ==================== */
    :root, [data-theme="dark"] {
      --blue: #2563eb;
      --blue-bright: #3b82f6;
      --blue-accent: #93c5fd;
      --bg-page: #000000;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
      --glass-border: rgba(255, 255, 255, 0.32);
      --glass-shadow:
        0 14px 34px rgba(0, 0, 0, 0.65),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.5),
        inset 0 -1px 1px rgba(59, 130, 246, 0.25);
      --surface-soft: rgba(255, 255, 255, 0.08);
      --surface-border: rgba(255, 255, 255, 0.22);
      --input-bg: rgba(255, 255, 255, 0.1);
      --placeholder: rgba(203, 213, 225, 0.6);
      --tab-text: rgba(255, 255, 255, 0.68);
      --tab-active-text: #ffffff;
      --tab-active-shadow: 0 0 10px rgba(147, 197, 253, 0.85);
      --indicator-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.28) 0%, rgba(147, 197, 253, 0.18) 50%, rgba(255, 255, 255, 0.24) 100%);
      --indicator-border: rgba(255, 255, 255, 0.78);
    }

    /* ==================== 浅色模式变量（纯白底 + 冰蓝液态玻璃） ==================== */
    [data-theme="light"] {
      --blue: #2563eb;
      --blue-bright: #1d4ed8;
      --blue-accent: #1d4ed8;
      --bg-page: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --glass-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.07) 0%, rgba(255, 255, 255, 0.78) 100%);
      --glass-border: rgba(37, 99, 235, 0.22);
      --glass-shadow:
        0 10px 28px rgba(15, 23, 42, 0.07),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 1px rgba(37, 99, 235, 0.12);
      --surface-soft: rgba(37, 99, 235, 0.06);
      --surface-border: rgba(37, 99, 235, 0.18);
      --input-bg: rgba(255, 255, 255, 0.85);
      --placeholder: rgba(100, 116, 139, 0.75);
      --tab-text: rgba(15, 23, 42, 0.62);
      --tab-active-text: #1d4ed8;
      --tab-active-shadow: 0 0 8px rgba(37, 99, 235, 0.25);
      --indicator-bg: linear-gradient(145deg, rgba(37, 99, 235, 0.18) 0%, rgba(147, 197, 253, 0.26) 50%, rgba(255, 255, 255, 0.75) 100%);
      --indicator-border: rgba(37, 99, 235, 0.55);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 125px;
      background-color: var(--bg-page);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 液态玻璃面板 */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--glass-border);
      border-radius: 0 0 22px 22px;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: var(--text);
      white-space: nowrap;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .manager-pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      white-space: nowrap;
    }
    .theme-btn {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--glass-border);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .container { padding: 14px; max-width: 640px; margin: 0 auto; }
    .card {
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    /* 账号切换胶囊栏 */
    .account-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }
    .acc-btn {
      min-width: 0;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: var(--surface-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.22s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .acc-btn.active {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border-color: rgba(255, 255, 255, 0.75);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }

    /* 日历样式 */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-nav {
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      border-radius: 11px;
      padding: 5px 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
    }
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      text-align: center;
    }
    .cal-weekdays div {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue-accent);
      padding-bottom: 4px;
    }
    .cal-day {
      min-width: 0;
      height: 46px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      padding: 2px;
      transition: all 0.18s ease;
    }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
