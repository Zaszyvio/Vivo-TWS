<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>门店管理 Liquid Glass</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-bright: #3b82f6;
      --blue-ice: #93c5fd;
      --white: #ffffff;
      --black: #050811;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      --glass-border: rgba(255, 255, 255, 0.34);
      --glass-shadow:
        0 14px 34px rgba(0, 0, 0, 0.55),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.55),
        inset 0 -1px 1px rgba(59, 130, 246, 0.25);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 125px;
      background-color: #000000;
    }

    /* 黑白蓝高折射液态玻璃 */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(180%) brightness(1.06);
      -webkit-backdrop-filter: blur(26px) saturate(180%) brightness(1.06);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 0 0 22px 22px;
    }
    header h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--white);
    }
    .manager-pill {
      font-size: 11px;
      padding: 4px 11px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.42), rgba(255, 255, 255, 0.14));
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: var(--white);
      font-weight: 700;
    }

    .container { padding: 14px; max-width: 640px; margin: 0 auto; }
    .card {
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--white);
    }

    /* 账号切换胶囊栏 */
    .account-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }
    .acc-btn {
      min-width: 0;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.22s ease;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .acc-btn.active {
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.85), rgba(29, 78, 216, 0.9));
      border-color: rgba(255, 255, 255, 0.75);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.75);
    }

    /* 日历样式 */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .cal-nav {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 11px;
      padding: 5px 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--white);
    }
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      text-align: center;
    }
    .cal-weekdays div {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue-ice);
      padding-bottom: 4px;
    }
    .cal-day {
      min-width: 0;
      height: 46px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--white);
      cursor: pointer;
      padding: 2px;
      transition: all 0.18s ease;
    }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.selected {
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.42), rgba(255, 255, 255, 0.16));
      border: 1.5px solid var(--white);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }
    .cal-day.today {
      border-color: var(--blue-ice);
    }
    .shift-dot {
      font-size: 9px;
      line-height: 1.1;
      padding: 2px 4px;
      border-radius: 6px;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    /* 黑白蓝统一色系班次标签 */
    .bg-morning { background: #2563eb; color: #ffffff; }
    .bg-evening { background: #1e3a8a; color: #dbeafe; border: 1px solid rgba(147, 197, 253, 0.5); }
    .bg-offday { background: rgba(255, 255, 255, 0.22); color: #ffffff; }
    .bg-unpaid { background: #0f172a; color: #93c5fd; border: 1px solid rgba(147, 197, 253, 0.4); }
    .bg-annual { background: #ffffff; color: #0f172a; }
    .bg-training { background: #38bdf8; color: #050811; }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .name-box {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .name-box label { font-size: 11px; color: var(--blue-ice); font-weight: 600; }

    input, select, button {
      font-size: 13px;
      padding: 9px 11px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      outline: none;
      max-width: 100%;
    }
    input::placeholder { color: rgba(203, 213, 225, 0.65); }
    button.primary {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      color: var(--white);
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
      cursor: pointer;
    }

    .shift-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .shift-choice {
      min-width: 0;
      padding: 10px 6px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.09);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shift-choice:active {
      background: rgba(59, 130, 246, 0.45);
      border-color: var(--white);
    }
    .shift-choice .swatch {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      padding: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .stat-item strong { display: block; font-size: 13px; margin-bottom: 4px; color: var(--white); }

    .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 100px; }
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      gap: 8px;
    }
    .stock-item:last-child { border-bottom: none; }
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .btn-sell {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: var(--white);
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-in {
      background: rgba(59, 130, 246, 0.45);
      border: 1px solid rgba(147, 197, 253, 0.65);
      color: var(--white);
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .qty-num { min-width: 34px; text-align: center; font-weight: 800; font-size: 15px; color: var(--white); }

    .cctv-card-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.45), rgba(255, 255, 255, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.42);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 黑白蓝液态玻璃底部悬浮胶囊栏 */
    .tab-bar-wrap {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 420px;
      z-index: 40;
    }
    .tab-bar {
      position: relative;
      display: flex;
      padding: 6px;
      border-radius: 999px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.24) 0%,
        rgba(59, 130, 246, 0.14) 50%,
        rgba(255, 255, 255, 0.2) 100%
      );
      backdrop-filter: blur(32px) saturate(200%) brightness(1.1);
      -webkit-backdrop-filter: blur(32px) saturate(200%) brightness(1.1);
      border: 1.2px solid rgba(255, 255, 255, 0.52);
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.65),
        inset 0 2px 2px rgba(255, 255, 255, 0.72),
        inset 0 -2px 3px rgba(37, 99, 235, 0.35);
    }
    .tab-indicator {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 6px;
      width: calc((100% - 12px) / 3);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(219, 234, 254, 0.85) 100%);
      border: 1px solid #ffffff;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.45), inset 0 1px 1px #ffffff;
      transition: transform 0.35s cubic-bezier(0.22, 1.25, 0.36, 1);
      pointer-events: none;
    }
    .tab-btn {
      position: relative;
      z-index: 1;
      flex: 1;
      background: transparent !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.78);
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .tab-btn .icon { font-size: 18px; }
    .tab-btn.active { color: #1d4ed8; }
    .hidden { display: none !important; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
  </style>
</head>
<body>

  <header class="glass">
    <h1>🏪 门店管理</h1>
    <span class="manager-pill" id="headerBadge">👑 店长视角</span>
  </header>

  <div class="container" id="tab-schedule">
    <div class="account-bar" id="accountBar"></div>

    <div class="card glass">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <strong id="calMonthTitle" style="font-size:15px;">2026年 11月</strong>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="hint" id="selectedDateInfo">当前选中日期：-</p>
    </div>

    <div class="card glass">
      <div class="card-title">
        <span>👤 人员名字设置（店长 + 3名员工）</span>
        <button class="primary" style="padding:5px 10px;font-size:12px;" onclick="saveNames()">保存名字</button>
      </div>
      <div class="name-grid">
        <div class="name-box">
          <label>我的名字（店长）</label>
          <input type="text" id="name_0" placeholder="输入你的名字" />
        </div>
        <div class="name-box">
          <label>员工 1</label>
          <input type="text" id="name_1" placeholder="输入员工1名字" />
        </div>
        <div class="name-box">
          <label>员工 2</label>
          <input type="text" id="name_2" placeholder="输入员工2名字" />
        </div>
        <div class="name-box">
          <label>员工 3</label>
          <input type="text" id="name_3" placeholder="输入员工3名字" />
        </div>
      </div>
    </div>

    <div class="card glass">
      <div class="card-title">
        <span>🕒 选择班次</span>
        <button style="padding:4px 8px;font-size:11px;" onclick="setShift('')">清除当天</button>
      </div>
      <div class="shift-options">
        <button class="shift-choice" onclick="setShift('早班')"><span class="swatch bg-morning"></span>早班</button>
        <button class="shift-choice" onclick="setShift('晚班')"><span class="swatch bg-evening"></span>晚班</button>
        <button class="shift-choice" onclick="setShift('offday')"><span class="swatch bg-offday"></span>Offday</button>
        <button class="shift-choice" onclick="setShift('unpaid leave')"><span class="swatch bg-unpaid"></span>Unpaid Leave</button>
        <button class="shift-choice" onclick="setShift('annual leave')"><span class="swatch bg-annual"></span>Annual Leave</button>
        <button class="shift-choice" onclick="setShift('training')"><span class="swatch bg-training"></span>Training</button>
      </div>
    </div>

    <div class="card glass" id="managerDashboard">
      <div class="card-title">
        <span>📊 店长总览（全店排班与工时统计）</span>
      </div>
      <div id="todayAllStaff" style="font-size:12px;margin-bottom:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);"></div>
      <div class="stats-grid" id="monthlyStatsGrid"></div>
    </div>
  </div>

  <div class="container hidden" id="tab-stock">
    <div class="card glass">
      <div class="card-title"><span>🔗 Google Sheets 同步接口</span></div>
      <div class="row">
        <input type="url" id="sheetUrlInput" placeholder="粘贴你的 Google Apps Script 链接" />
        <button class="primary" onclick="saveSheetUrl()">保存</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button style="flex:1;font-weight:700;" onclick="pullFromSheet()">⬇️ 从 Sheet 拉取最新货单</button>
        <button class="primary" style="flex:1;" onclick="pushToSheet('全量盘点同步')">⬆️ 同步到 Sheet</button>
      </div>
      <p class="hint" id="stockSyncMsg">状态：本地已就绪（卖出减库存、进货加库存后会自动记录并同步）。</p>
    </div>

    <div class="card glass">
      <div class="card-title"><span>➕ 新增货品</span></div>
      <div class="row" style="margin-bottom:0;">
        <input type="text" id="newItemName" placeholder="货品名称" />
        <input type="number" id="newItemQty" placeholder="初始数量" style="max-width:100px;" />
        <button class="primary" onclick="addStockItem()">添加</button>
      </div>
    </div>

    <div class="card glass">
      <div class="card-title"><span>📦 店内 Stock 清单（卖了减 / 进货加）</span></div>
      <div id="stockList"></div>
    </div>
  </div>

  <div class="container hidden" id="tab-cctv">
    <div class="card glass">
      <div class="card-title"><span>📹 TP-Link 监控快捷入口</span></div>
      <button class="cctv-card-btn" onclick="openCctv('tapo://')">
        <span>TP-Link Tapo</span><span>打开 ›</span>
      </button>
      <button class="cctv-card-btn" onclick="openCctv('vigi://')">
        <span>TP-Link VIGI</span><span>打开 ›</span>
      </button>
      <p class="hint">下一步等你的界面跑通后，我教你如何配置与你手机上 TP-Link App 的直连方式。</p>
    </div>
  </div>

  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <div class="tab-indicator" id="tabIndicator"></div>
      <button class="tab-btn active" onclick="switchTab('schedule', 0, this)">
        <span class="icon">📅</span><span>时间表</span>
      </button>
      <button class="tab-btn" onclick="switchTab('stock', 1, this)">
        <span class="icon">📦</span><span>Stock</span>
      </button>
      <button class="tab-btn" onclick="switchTab('cctv', 2, this)">
        <span class="icon">📷</span><span>CCTV</span>
      </button>
    </nav>
  </div>

  <script>
    const KEY = "store_liquid_v2";
    const todayStr = new Date().toISOString().slice(0, 10);

    let data = JSON.parse(localStorage.getItem(KEY)) || {
      users: ["我（店长）", "员工 1", "员工 2", "员工 3"],
      activeUser: 0,
      shifts: {},
      sheetUrl: "",
      stocks: [
        { id: 1, name: "示例货品 A", qty: 20 },
        { id: 2, name: "示例货品 B", qty: 12 }
      ]
    };

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDate = todayStr;

    function saveData() {
      localStorage.setItem(KEY, JSON.stringify(data));
    }

    function switchTab(name, idx, btn) {
      ["schedule", "stock", "cctv"].forEach(t => document.getElementById("tab-" + t).classList.add("hidden"));
      document.getElementById("tab-" + name).classList.remove("hidden");
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tabIndicator").style.transform = `translateX(${idx * 100}%)`;
    }

    function renderAccounts() {
      const bar = document.getElementById("accountBar");
      bar.innerHTML = data.users.map((u, idx) => `
        <button class="acc-btn ${data.activeUser === idx ? 'active' : ''}" onclick="selectUser(${idx})">
          ${idx === 0 ? '👑 ' : ''}${u || ('员工 ' + idx)}
        </button>
      `).join("");

      data.users.forEach((u, idx) => {
        document.getElementById("name_" + idx).value = u;
      });

      const isManager = data.activeUser === 0;
      document.getElementById("headerBadge").textContent = isManager ? "👑 店长视角（完整资讯）" : "👤 员工视角：" + data.users[data.activeUser];
      document.getElementById("managerDashboard").classList.toggle("hidden", !isManager);
    }

    function selectUser(idx) {
      data.activeUser = idx;
      saveData();
      renderAccounts();
      renderCalendar();
    }

    function saveNames() {
      for (let i = 0; i < 4; i++) {
        const val = document.getElementById("name_" + i).value.trim();
        if (val) data.users[i] = val;
      }
      saveData();
      renderAccounts();
      renderCalendar();
      alert("名字已更新！");
    }

    function shiftClass(s) {
      if (s === "早班") return "bg-morning";
      if (s === "晚班") return "bg-evening";
      if (s === "offday") return "bg-offday";
      if (s === "unpaid leave") return "bg-unpaid";
      if (s === "annual leave") return "bg-annual";
      if (s === "training") return "bg-training";
      return "";
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById("calMonthTitle").textContent = `${currentYear}年 ${currentMonth + 1}月`;
      const grid = document.getElementById("calGrid");
      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      let html = "";
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="cal-day empty"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const key = `${data.activeUser}_${dateStr}`;
        const shift = data.shifts[key] || "";
        const isSel = dateStr === selectedDate ? "selected" : "";
        const isToday = dateStr === todayStr ? "today" : "";
        html += `
          <div class="cal-day ${isSel} ${isToday}" onclick="pickDate('${dateStr}')">
            <span>${d}</span>
            ${shift ? `<span class="shift-dot ${shiftClass(shift)}">${shift}</span>` : ""}
          </div>
        `;
      }
      grid.innerHTML = html;

      const curShift = data.shifts[`${data.activeUser}_${selectedDate}`] || "未排班";
      document.getElementById("selectedDateInfo").textContent =
        `当前账号：【${data.users[data.activeUser]}】 | 选中日期：${selectedDate}（${curShift}）`;

      renderManagerStats();
    }

    function pickDate(dateStr) {
      selectedDate = dateStr;
      renderCalendar();
    }

    function setShift(shiftName) {
      const key = `${data.activeUser}_${selectedDate}`;
      if (!shiftName) {
        delete data.shifts[key];
      } else {
        data.shifts[key] = shiftName;
      }
      saveData();
      renderCalendar();
    }

    function renderManagerStats() {
      if (data.activeUser !== 0) return;

      const daySummary = data.users.map((u, idx) => {
        const s = data.shifts[`${idx}_${selectedDate}`] || "未排班";
        return `${u}：<b style="color:#fff">${s}</b>`;
      }).join(" ｜ ");
      document.getElementById("todayAllStaff").innerHTML = `📅 <b style="color:#93c5fd">${selectedDate} 全店班表：</b><br/>${daySummary}`;

      const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}`;
      const statsHtml = data.users.map((u, idx) => {
        let workDays = 0, offDays = 0, leaveDays = 0;
        Object.keys(data.shifts).forEach(k => {
          if (k.startsWith(`${idx}_${monthPrefix}`)) {
            const val = data.shifts[k];
            if (val === "早班" || val === "晚班" || val === "training") workDays++;
            else if (val === "offday") offDays++;
            else leaveDays++;
          }
        });
        return `
          <div class="stat-item">
            <strong>${idx === 0 ? "👑 " : ""}${u}</strong>
            出勤/培训：${workDays} 天<br/>
            Offday：${offDays} 天 ｜ 请假：${leaveDays} 天
          </div>
        `;
      }).join("");
      document.getElementById("monthlyStatsGrid").innerHTML = statsHtml;
    }

    document.getElementById("sheetUrlInput").value = data.sheetUrl || "";

    function saveSheetUrl() {
      data.sheetUrl = document.getElementById("sheetUrlInput").value.trim();
      saveData();
      alert("Google Sheets 链接已保存");
    }

    function addStockItem() {
      const name = document.getElementById("newItemName").value.trim();
      const qty = parseInt(document.getElementById("newItemQty").value, 10) || 0;
      if (!name) return alert("请输入货品名称");
      data.stocks.push({ id: Date.now(), name, qty });
      saveData();
      renderStocks();
      document.getElementById("newItemName").value = "";
      document.getElementById("newItemQty").value = "";
      pushToSheet(`新增货品: ${name} (${qty})`);
    }

    function updateStock(id, delta, actionLabel) {
      const item = data.stocks.find(s => s.id === id);
      if (!item) return;
      item.qty = Math.max(0, item.qty + delta);
      saveData();
      renderStocks();
      pushToSheet(`${actionLabel}: ${item.name} (${delta > 0 ? '+' + delta : delta}) -> 剩余 ${item.qty}`);
    }

    function renderStocks() {
      const list = document.getElementById("stockList");
      if (!data.stocks.length) {
        list.innerHTML = `<p class="hint">暂无货品，请先添加或从 Sheet 拉取。</p>`;
        return;
      }
      list.innerHTML = data.stocks.map(s => `
        <div class="stock-item">
          <div>
            <strong>${s.name}</strong>
          </div>
          <div class="qty-controls">
            <button class="btn-sell" onclick="updateStock(${s.id}, -1, '卖出')">卖 -1</button>
            <span class="qty-num">${s.qty}</span>
            <button class="btn-in" onclick="updateStock(${s.id}, 1, '进货')">进 +1</button>
          </div>
        </div>
      `).join("");
    }

    async function pushToSheet(note) {
      const msg = document.getElementById("stockSyncMsg");
      if (!data.sheetUrl) {
        msg.textContent = `本地已更新（${note}）。填入 Sheet 链接后可自动同步。`;
        return;
      }
      msg.textContent = "正在同步到 Google Sheet...";
      try {
        await fetch(data.sheetUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "sync",
            note,
            updatedAt: new Date().toISOString(),
            items: data.stocks
          })
        });
        msg.textContent = `✅ 已同步至 Sheet（${new Date().toLocaleTimeString()} - ${note}）`;
      } catch (e) {
        msg.textContent = "⚠️ 同步失败，请检查网络连接或 Sheet 链接。";
      }
    }

    async function pullFromSheet() {
      const msg = document.getElementById("stockSyncMsg");
      if (!data.sheetUrl) return alert("请先填写并保存你的 Google Apps Script 链接");
      msg.textContent = "正在从 Sheet 读取货单...";
      try {
        const res = await fetch(data.sheetUrl);
        const json = await res.json();
        if (Array.isArray(json.items)) {
          data.stocks = json.items.map((it, idx) => ({
            id: Date.now() + idx,
            name: it.name,
            qty: Number(it.qty) || 0
          }));
          saveData();
          renderStocks();
          msg.textContent = `✅ 已从 Sheet 拉取 ${data.stocks.length} 项货品`;
        }
      } catch (e) {
        msg.textContent = "⚠️ 读取失败：请确认你的 Apps Script 已包含 doGet() 并允许任何人访问。";
      }
    }

    function openCctv(scheme) {
      window.location.href = scheme;
    }

    renderAccounts();
    renderCalendar();
    renderStocks();
  </script>
</body>
</html>
